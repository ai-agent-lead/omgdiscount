<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #fbf8f3;
    --ink: #0a0a0a;
    --ink-2: #27272a;
    --muted: #4b4b53;
    --faint: #5c5c65;
    --rule: rgb(0 0 0 / .18);
    --rule-soft: rgb(0 0 0 / .10);
    --tag-bg: #e6dfd2;
    --accent-fg: #1e40af;
    --accent-soft: #dbeafe;
    --gate-fg: #78350f;
    --gate-bg: #fef3c7;
    --focus: #1d4ed8;
    --c-dev: #b45309;
    --c-cloud: #1e40af;
    --c-ai: #0f766e;
    --c-dev: #b45309;
    --c-ops: #6b21a8;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --on-accent: #ffffff;
    --shadow-soft: 0 0 0 1px rgb(0 0 0 / .06), 0 1px 2px rgb(0 0 0 / .04), 0 12px 32px -20px rgb(0 0 0 / .2);
    --highlight: inset 0 1px 0 0 #fff;
    --ease: cubic-bezier(.25, .8, .25, 1);
    --dot: rgb(0 0 0 / .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #162036;
      --ink: #f8fafc;
      --ink-2: #e2e8f0;
      --muted: #c4cbd6;
      --faint: #a3adbd;
      --rule: rgb(255 255 255 / .18);
      --rule-soft: rgb(255 255 255 / .10);
      --tag-bg: #1e2a44;
      --accent-fg: #bfdbfe;
      --accent-soft: #1e3a8a;
      --gate-fg: #fde68a;
      --gate-bg: #3f2e06;
      --focus: #93c5fd;
      --dot: rgb(255 255 255 / .09);
      --accent: #5d61ec;
      --accent-hover: #7174f2;
      --on-accent: #ffffff;
      --shadow-soft: inset 0 1px 0 0 rgb(255 255 255 / .08), 0 0 0 1px rgb(255 255 255 / .1), 0 24px 48px -32px #000;
      --highlight: inset 0 1px 0 0 rgb(255 255 255 / .18);
      --c-dev: #fcd34d;
    }
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: transparent; color: var(--ink-2); font-family: var(--sans); font-size: 16px; line-height: 1.5; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
  .page { max-width: 1040px; margin: 0 auto; padding: 0 32px 120px; }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(100% 60% at 50% 0, #000 25%, transparent 75%);
    mask-image: radial-gradient(100% 60% at 50% 0, #000 25%, transparent 75%);
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  a { color: inherit; }

  .bar { display: flex; justify-content: space-between; align-items: center; height: 64px; }
  .wordmark { display: inline-block; font-size: 20px; font-weight: 800; letter-spacing: -0.035em; color: var(--ink); text-decoration: none; line-height: 1; white-space: nowrap; }
  .wordmark .disc { color: var(--c-dev); }
  .wordmark .coin { position: relative; display: inline-block; width: .92em; height: .92em; border-radius: 50%; vertical-align: -.14em; background: radial-gradient(circle at 35% 30%, #fde68a 0%, #f5b82e 48%, #b7791f 100%); box-shadow: inset 0 0 0 .06em rgb(255 255 255 / .35), inset 0 -.08em 0 .06em rgb(120 53 15 / .25); }
  .wordmark .coin::after { content: ""; position: absolute; left: 50%; top: 50%; width: .38em; height: .38em; background: #1c1917; border-radius: .05em; transform: translate(-50%, -50%) rotate(45deg); }
  .back { font-size: 14px; color: var(--ink); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; min-height: 40px; display: inline-flex; align-items: center; }
  .back:hover { text-decoration-color: var(--ink); }

  .crumb { margin-top: 40px; display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { display: inline-flex; align-items: center; box-sizing: border-box; min-height: 26px; max-width: 100%; padding: 5px 12px; border-radius: 999px; background: var(--tag-bg); font-family: var(--sans); font-size: 13px; line-height: 1.3; letter-spacing: 0; color: var(--ink-2); font-weight: 500; text-align: left; white-space: normal; }
  .tag.ai { color: var(--accent-fg); background: var(--accent-soft); }
  .tag.gate { color: var(--gate-fg); background: var(--gate-bg); }
  a.tag { text-decoration: none; }
  a.tag:hover { text-decoration: underline; text-underline-offset: 3px; }

  .logo { position: relative; display: inline-flex; align-items: center; height: 36px; min-width: 36px; margin-top: 32px; }
  .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: left center; }
  @media (prefers-color-scheme: dark) { .logo img { filter: invert(1); } }
  .logo-text { font-size: 15px; font-weight: 600; color: var(--muted); white-space: nowrap; }

  h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.04; font-weight: 600; letter-spacing: -0.035em; color: var(--ink); margin: 16px 0 0; max-width: 18ch; text-wrap: balance; }
  .lede { font-size: 21px; line-height: 1.45; letter-spacing: -0.015em; color: var(--ink-2); margin: 20px 0 0; max-width: 46ch; text-wrap: pretty; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 64px; margin-top: 56px; align-items: start; }

  .section { padding: 28px 0; border-top: 1px solid var(--rule); }
  .section:first-child { border-top: 0; padding-top: 0; }
  .section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 0 0 12px; }
  .section p, .section li { font-size: 17px; color: var(--ink-2); margin: 0; max-width: 60ch; text-wrap: pretty; }
  .section ul { padding: 0; margin: 0; list-style: none; display: grid; gap: 12px; }
  .section li { position: relative; padding-left: 22px; }
  .section li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 8px; border-radius: 2px; background: var(--ink); }

  .steps { counter-reset: step; padding: 0; margin: 0; list-style: none; display: grid; gap: 16px; }
  .steps li { counter-increment: step; display: grid; grid-template-columns: 32px 1fr; gap: 12px; padding: 0; }
  .steps li::before { content: counter(step); position: static; width: 32px; height: 32px; border-radius: 999px; background: var(--tag-bg); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; }
  .steps li span { font-size: 17px; color: var(--ink-2); padding-top: 4px; }

  .side { position: sticky; top: 32px; background: var(--surface); box-shadow: var(--shadow-soft); border-radius: 20px; padding: 28px; }
  .side .amount-value { font-size: 44px; font-weight: 600; color: var(--ink); margin: 0; letter-spacing: -0.03em; font-variant-numeric: tabular-nums lining-nums; line-height: 1.05; }
  .side .amount-unit { font-size: 15px; color: var(--muted); margin: 6px 0 0; }
  .side dl { display: grid; grid-template-columns: 96px 1fr; gap: 12px 12px; margin: 24px 0 0; font-size: 15px; }
  .side dt { color: var(--faint); font-size: 13px; padding-top: 2px; }
  .side dd { margin: 0; color: var(--ink-2); }
  .apply { display: flex; align-items: center; justify-content: center; height: 48px; margin-top: 24px; border-radius: 999px; background: var(--accent); color: var(--on-accent); text-decoration: none; font-size: 16px; font-weight: 500; box-shadow: var(--highlight), 0 1px 2px rgb(0 0 0 / .12); transition: background 160ms var(--ease); }
  .apply:hover { background: var(--accent-hover); }
  .side .note { font-size: 13px; color: var(--faint); margin: 14px 0 0; text-align: center; }

  .related { margin-top: 96px; }
  .related h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 0 0 8px; }
  .rel-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; list-style: none; padding: 0; margin: 16px 0 0; }
  .rel-list a { display: block; padding: 20px; box-shadow: var(--shadow-soft); border-radius: 16px; background: var(--surface); text-decoration: none; height: 100%; transition: border-color 160ms var(--ease); }
  .rel-list a:hover { border-color: var(--ink); }
  .rel-list b { display: block; font-size: 17px; color: var(--ink); font-weight: 600; letter-spacing: -0.01em; }
  .rel-list span { display: block; margin-top: 6px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .site-foot { margin-top: 96px; padding-top: 48px; border-top: 1px solid var(--rule); }
  .foot-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; }
  .foot-brand .wordmark { font-size: 22px; }
  .foot-brand p { margin: 14px 0 0; font-size: 15px; color: var(--muted); max-width: 34ch; }
  .foot-col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; margin: 0 0 10px; }
  .foot-col a { display: block; padding: 6px 0; font-size: 15px; color: var(--ink-2); text-decoration: none; min-height: 32px; }
  .foot-col a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  .foot-base { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--rule-soft); display: grid; gap: 10px; font-size: 13px; color: var(--faint); text-wrap: pretty; }
  .foot-base p { margin: 0; }
  .foot-base a { color: var(--ink); text-underline-offset: 3px; }
  @media (max-width: 720px) {
    .foot-grid { grid-template-columns: 1fr 1fr; gap: 32px 24px; }
    .foot-brand { grid-column: 1 / -1; }
    .foot-col a { min-height: 40px; padding: 8px 0; }
  }
  .foot { margin-top: 64px; font-size: 13px; color: var(--faint); text-align: center; text-wrap: balance; }
  .missing { padding: 120px 0; text-align: center; }
  .missing p { font-size: 19px; color: var(--muted); }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 40px; }
    .side { position: static; }
  }
  @media (max-width: 720px) {
    .page { padding: 0 20px 96px; }
    .crumb { margin-top: 28px; }
    .lede { font-size: 18px; }
    .layout { margin-top: 40px; }
  }
  .apply.off { opacity: .45; pointer-events: none; box-shadow: none; }
</style>
